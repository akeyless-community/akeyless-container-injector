# Pattern A: single container — inject + restart app process on secret change (rollout-restart equivalent)
# Credentials: cp .env.example .env (never commit .env)
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AKEYLESS_ACCESS_ID: ${AKEYLESS_ACCESS_ID:-}
      AKEYLESS_ACCESS_KEY: ${AKEYLESS_ACCESS_KEY:-}
      AKEYLESS_GATEWAY_URL: ${AKEYLESS_GATEWAY_URL:-https://api.akeyless.io}
      # Universal Identity (uncomment and mount uid token file):
      # AKEYLESS_ACCESS_TYPE: universal_identity
      # AKEYLESS_UID_TOKEN_FILE: /run/akeyless/uid-token
    # volumes:
    #   - ${HOME}/.akeyless/uid_rotator/uid-token:/run/akeyless/uid-token:ro
    volumes:
      - ./inject.yaml:/config/inject.yaml:ro
    entrypoint:
      - /usr/local/bin/akeyless-inject
    command:
      - run
      - --spec
      - /config/inject.yaml
      - --
      - sh
      - -c
      - echo "injected len=$${#MY_SECRET}" && exec sleep infinity

