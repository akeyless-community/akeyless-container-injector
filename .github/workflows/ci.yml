name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Secret scan
        run: make check-secrets
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -buildvcs=false -o /dev/null ./cmd/akeyless-inject
